[project]
name = "lunar-pressure"
version = "0.1.0"
description = "Closed-loop pressure-gauge orchestration server for RM75 OpenPI demos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.0.0",
  "msgpack>=1.0.0",
  "numpy>=1.24",
  "pillow>=10.0.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
hardware = [
  "pyrealsense2>=2.55",
]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
